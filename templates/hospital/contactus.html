<!DOCTYPE html>
{% load static %}
<html lang="es" dir="ltr">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>HMS - Gestión Hospitalaria</title>

  <!-- Librerías de Leaflet y Routing Machine -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />

  <style>
    #map {
      height: 450px;
      width: 100%;
      border-radius: 10px;
      box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.15);
      margin-top: 15px;
    }
    .route-buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>

  {% include "hospital/navbar.html" %}
  <br><br>

  <center>
    <h3 class='alert alert-success'>¡Envíenos sus valiosos comentarios!</h3>

    <form method="POST" id="contactForm">
      {% csrf_token %}
      <div class="form-group">
        <p><h3>{{ form.as_p }}</h3></p>
        <br>
        <input type="submit" value="Enviar Mensaje" class='btn btn-primary btn-lg'>
      </div>
    </form>

    <br><br>

    <!-- Sección de Mapa Interactivo -->
    <div style="max-width: 85%; margin: 20px auto; text-align: center;">
      <h3 class="alert alert-info">Ubicación y Ruta al Hospital</h3>

      <!-- Botones para calcular ruta -->
      <div class="route-buttons">
        <button type="button" class="btn btn-primary" onclick="calcularRuta('driving')">
          🚗 Ruta en Auto
        </button>
        <button type="button" class="btn btn-success" onclick="calcularRuta('foot')">
          🚶 Ruta Caminando
        </button>
      </div>

      <!-- Contenedor donde se dibuja el mapa -->
      <div id="map"></div>
    </div>
  </center>

  <!-- Scripts de Leaflet -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>

  <script>
    // 1. Configuración de Mapa e Itinerario Leaflet
    const hospitalLat = -10.6860745;
    const hospitalLng = -76.2653853;

    const map = L.map('map').setView([hospitalLat, hospitalLng], 15);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);

    L.marker([hospitalLat, hospitalLng]).addTo(map)
      .bindPopup('<b>EsSalud Hospital Nivel II Pasco</b><br>Atención 24/7')
      .openPopup();

    let controlRuta = null;

    function calcularRuta(modoTransporte) {
      if (!navigator.geolocation) {
        alert("Tu navegador no admite geolocalización.");
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (posicion) => {
          const userLat = posicion.coords.latitude;
          const userLng = posicion.coords.longitude;

          if (controlRuta) {
            map.removeControl(controlRuta);
          }

          controlRuta = L.Routing.control({
            waypoints: [
              L.latLng(userLat, userLng),
              L.latLng(hospitalLat, hospitalLng)
            ],
            router: L.Routing.osrmv1({ profile: modoTransporte }),
            lineOptions: {
              styles: [{ color: modoTransporte === 'driving' ? '#007bff' : '#28a745', weight: 6 }]
            },
            createMarker: function(i, wp) {
              if (i === 0) {
                return L.marker(wp.latLng).bindPopup("<b>Tu Ubicación Actual</b>");
              } else {
                return L.marker(wp.latLng).bindPopup("<b>EsSalud Hospital Nivel II Pasco</b>");
              }
            }
          }).addTo(map);
        },
        () => alert("Por favor, permite el acceso a tu ubicación en el navegador.")
      );
    }

    // 2. Envío Asíncrono a Google Apps Script
    const scriptURL = 'https://script.google.com/a/macros/undac.edu.pe/s/AKfycbxcgwuHZZTTge_tfCYNjnv4SOM50nJ61Rc4CkjihQWKOnlTaHkAQ-gTc6HH-WsvDt3Z/exec';

    const contactForm = document.getElementById('contactForm');
    if (contactForm) {
      contactForm.addEventListener('submit', async function(e) {
        e.preventDefault(); 

        const inputs = contactForm.querySelectorAll('input[type="text"], textarea');
        let contenido = '';
        inputs.forEach(input => {
          if (input.value) contenido += `${input.name}: ${input.value}\n`;
        });

        try {
          await fetch(scriptURL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              nombre: 'Paciente / Usuario Web',
              mensaje: contenido || 'Mensaje enviado desde la web'
            })
          });
        } catch (err) {
          console.error('Error al enviar webhook:', err);
        }

        contactForm.submit();
      });
    }
  </script>

  {% include "hospital/footer.html" %}
</body>

</html>
