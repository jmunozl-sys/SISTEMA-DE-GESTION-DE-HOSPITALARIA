<!DOCTYPE html>
{% load static %}
<html lang="en" dir="ltr">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>HMS - Django</title>
</head>

<body>

  {% include "hospital/navbar.html" %}
  <br><br>

  <center>
    <h3 class='alert alert-success'>Send Us Your Valuable Feedback !</h3>

    <form method="POST">
      <!-- Very Important csrf Token -->
      {% csrf_token %}
      <div class="form-group">
        <p>
        <h3>{{ form.as_p }}</h3>
        </p>
        <br>
        <input type="submit" value="Send Message" class='btn btn-primary btn-lg'>
      </div>
    </form>

    <br><br>

    <!-- Mapa de Google Maps -->
    <div style="max-width: 85%; margin: 20px auto;">
      <h3 class="alert alert-info">Ubicación del Hospital</h3>
      <iframe 
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d505.7649085362431!2d-76.26538536194076!3d-10.68607456262298!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x91086d5a1e6ad7f5%3A0x2892433361ad80b5!2sEsSalud%20Hospital%20Nivel%20II%20Pasco!5e0!3m2!1ses-419!2spe!4v1788761334580!5m2!1ses-419!2spe" 
        width="100%" 
        height="400" 
        style="border:0; border-radius: 10px; box-shadow: 0px 0px 10px rgba(0,0,0,0.15);" 
        allowfullscreen="" 
        loading="lazy" 
        referrerpolicy="strict-origin-when-cross-origin">
      </iframe>
    </div>
  </center>

  {% include "hospital/footer.html" %}
</body>

</html>
